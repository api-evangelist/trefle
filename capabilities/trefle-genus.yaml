naftiko: 1.0.0-alpha2
info:
  label: Trefle API — Genus
  description: 'Trefle API — Genus. 2 operations. Lead operation: List Genus. Self-contained Naftiko capability covering one
    Trefle business surface.'
  tags:
  - Trefle
  - Genus
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TREFLE_API_KEY: TREFLE_API_KEY
capability:
  consumes:
  - type: http
    namespace: trefle-genus
    baseUri: https://trefle.io/api/v1
    description: Trefle API — Genus business capability. Self-contained, no shared references.
    resources:
    - name: genus
      path: /genus
      operations:
      - name: listgenus
        method: GET
        description: List Genus
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: page
          in: query
          type: integer
    - name: genus-id
      path: /genus/{id}
      operations:
      - name: getgenus
        method: GET
        description: Get Genus
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
    authentication:
      type: apikey
      key: token
      value: '{{env.TREFLE_API_KEY}}'
      placement: query
  exposes:
  - type: rest
    namespace: trefle-genus-rest
    port: 8080
    description: REST adapter for Trefle API — Genus. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/genus
      name: genus
      description: REST surface for genus.
      operations:
      - method: GET
        name: listgenus
        description: List Genus
        call: trefle-genus.listgenus
        with:
          page: rest.page
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/genus/{id}
      name: genus-id
      description: REST surface for genus-id.
      operations:
      - method: GET
        name: getgenus
        description: Get Genus
        call: trefle-genus.getgenus
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: trefle-genus-mcp
    port: 9090
    transport: http
    description: MCP adapter for Trefle API — Genus. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-genus
      description: List Genus
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: trefle-genus.listgenus
      with:
        page: tools.page
      outputParameters:
      - type: object
        mapping: $.
    - name: get-genus
      description: Get Genus
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: trefle-genus.getgenus
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.

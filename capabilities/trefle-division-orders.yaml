naftiko: 1.0.0-alpha2
info:
  label: Trefle API — Division Orders
  description: 'Trefle API — Division Orders. 1 operations. Lead operation: List Division Orders. Self-contained Naftiko capability
    covering one Trefle business surface.'
  tags:
  - Trefle
  - Division Orders
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TREFLE_API_KEY: TREFLE_API_KEY
capability:
  consumes:
  - type: http
    namespace: trefle-division-orders
    baseUri: https://trefle.io/api/v1
    description: Trefle API — Division Orders business capability. Self-contained, no shared references.
    resources:
    - name: division_orders
      path: /division_orders
      operations:
      - name: listdivisionorders
        method: GET
        description: List Division Orders
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: token
      value: '{{env.TREFLE_API_KEY}}'
      placement: query
  exposes:
  - type: rest
    namespace: trefle-division-orders-rest
    port: 8080
    description: REST adapter for Trefle API — Division Orders. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/division-orders
      name: division-orders
      description: REST surface for division_orders.
      operations:
      - method: GET
        name: listdivisionorders
        description: List Division Orders
        call: trefle-division-orders.listdivisionorders
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: trefle-division-orders-mcp
    port: 9090
    transport: http
    description: MCP adapter for Trefle API — Division Orders. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-division-orders
      description: List Division Orders
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: trefle-division-orders.listdivisionorders
      outputParameters:
      - type: object
        mapping: $.
